            </tr>
            <tr>

            </tr>
            <tr>

            </tr>
            <tr>
                <td>domingo</td>

            </tr>
            <tr>
                <td>lunes</td>

            </tr>
        </tbody>
    </table>

    <script>
        function formatearHora(hora) {
            return hora < 10 ? '0' + hora : hora;
        }

        function horaActual() {
            const ahora = new Date();
            return {
                dia: ahora.toLocaleDateString('es-ES', { weekday: 'long' }).toLowerCase(),
                hora: ahora.getHours(),
                minuto: ahora.getMinutes()
            };
        }

        function actualizarTabla() {
            const horarios = {
                'martes': { apertura: '8:30', cierre: '18:00' },
                'miércoles': { apertura: '8:30', cierre: '18:00' },
                'jueves': { apertura: '8:30', cierre: '18:00' },
                'viernes': { apertura: '8:30', cierre: '18:00' },
                'sábado': { apertura: 'Cerrado', cierre: '' },
                'domingo': { apertura: '8:00', cierre: '10:30' },
                'lunes': { apertura: '8:30', cierre: '18:00' }
            };

        actualizarTabla();

        setInterval(actualizarTabla, 60000);
